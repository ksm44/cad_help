/* Форматирование сумм: 1000000 -> 1 000 000 */
function formatMoneyInput(el){
  const raw=el.value.replace(/\s/g,'').replace(',','.').replace(/[^\d.]/g,'');
  if(!raw){el.value='';return;}
  const dot=raw.indexOf('.');
  let intPart=dot>=0?raw.slice(0,dot):raw;
  let frac=dot>=0?raw.slice(dot+1):'';
  intPart=intPart.replace(/^0+(?=\d)/,'');
  frac=frac.slice(0,2);
  const grouped=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  el.value=dot>=0?(grouped+(frac?','+frac:'')):grouped;
}

/* Компонент кастомного выпадающего списка с поиском */
function createCombo(root,{id,items,placeholder,onChange}){
  root.innerHTML=`<button type="button" class="combo-input placeholder" id="${id}" aria-haspopup="listbox" aria-expanded="false"></button>
    <div class="combo-panel">
      <div class="combo-search"><input type="text" placeholder="Поиск…" aria-label="Поиск"></div>
      <ul class="combo-list" role="listbox"></ul>
    </div>`;
  const btn=root.querySelector('.combo-input');
  const search=root.querySelector('.combo-search input');
  const list=root.querySelector('.combo-list');
  let value='', hl=-1, filtered=items;

  function labelOf(v){const it=items.find(i=>i[0]===v);return it?it[1]:'';}
  function setDisplay(){
    const l=value?labelOf(value):'';
    btn.textContent=l||placeholder;
    btn.classList.toggle('placeholder',!l);
    btn.classList.toggle('filled',!!l);
  }
  function renderList(){
    list.innerHTML='';
    if(!filtered.length){list.innerHTML='<li class="empty">Ничего не найдено</li>';return;}
    filtered.forEach((it,idx)=>{
      const li=document.createElement('li');
      li.textContent=it[1];
      li.dataset.value=it[0];
      li.setAttribute('role','option');
      li.setAttribute('aria-selected',String(it[0]===value));
      if(idx===hl) li.classList.add('hl');
      li.addEventListener('click',()=>select(it[0]));
      list.appendChild(li);
    });
  }
  function select(v){
    value=v;hl=-1;
    setDisplay();
    root.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
    if(typeof onChange==='function') onChange(v);
  }
  function open(){
    filtered=items.slice();
    search.value='';
    hl=-1;
    renderList();
    root.classList.add('open');
    btn.setAttribute('aria-expanded','true');
    setTimeout(()=>search.focus(),0);
  }
  function close(){root.classList.remove('open');btn.setAttribute('aria-expanded','false');}

  btn.addEventListener('click',e=>{
    e.stopPropagation();
    root.classList.contains('open')?close():open();
  });
  search.addEventListener('input',()=>{
    const q=search.value.trim().toLocaleLowerCase('ru');
    filtered=items.filter(it=>it[1].toLocaleLowerCase('ru').includes(q));
    hl=-1;renderList();
  });
  search.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(!filtered.length)return;hl=(hl+1)%filtered.length;renderList();list.children[hl]?.scrollIntoView({block:'nearest'});}
    else if(e.key==='ArrowUp'){e.preventDefault();if(!filtered.length)return;hl=(hl-1+filtered.length)%filtered.length;renderList();list.children[hl]?.scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){e.preventDefault();if(hl>=0&&filtered[hl])select(filtered[hl][0]);}
    else if(e.key==='Escape'){e.preventDefault();close();btn.focus();}
  });
  document.addEventListener('click',e=>{if(!root.contains(e.target))close();});

  setDisplay();
  return {
    get value(){return value;},
    set value(v){value=v||'';setDisplay();},
    label:()=>labelOf(value)
  };
}

        <label for="cadValue">Кадастровая стоимость, ₽</label>
        <input id="cadValue" inputmode="decimal" placeholder="Например, 25 000 000" data-money>
        <div class="hint">Введите стоимость всего объекта. При регистрации доли калькулятор применит её к доле.</div>
      </div>

      <div class="field">
        <label for="shareNum">Размер регистрируемой доли — числитель</label>
        <input id="shareNum" type="number" min="1" placeholder="1">
      </div>
      <div class="field">
        <label for="shareDen">Размер регистрируемой доли — знаменатель</label>
        <input id="shareDen" type="number" min="1" placeholder="1">
        <div class="hint">Для 1/2 укажите 1 и 2. Для целого объекта — 1 и 1.</div>
      </div>

      <div class="actions">
        <button class="quiet" id="clear">Очистить форму</button>
        <button class="primary" id="calc">Рассчитать</button>
      </div>
      <label class="autocalc" title="Вкл/выкл авторасчет результата при любом изменении"><input type="checkbox" id="autoCalc" > Авторасчет</label>
    </section>

    <section class="panel" aria-live="polite">
      <div class="eyebrow">Предварительный результат</div>
      <div id="total" style="font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-1px;color:#205a46;margin:6px 0">—</div>
      <p id="perPerson" class="muted" style="margin:0 0 10px">Выберите действие и нажмите «Рассчитать».</p>
      <div id="detail" class="answers" style="font-size:14px"></div>
      <div class="notice" style="font-size:13px;color:#627469;margin-top:14px"><b>Важно.</b> Независимый справочный калькулятор, не сервис Росреестра. Не запрашивает ЕГРН и не формирует платёжный документ. Перед оплатой сверьте расчёт на официальном сайте Росреестра с учётом льгот и актуальной редакции НК РФ.</div>
    </section>
  </div>`;

  actionCombo=createCombo(document.getElementById('actionCombo'),{id:'action',items:ACTIONS,placeholder:'-- Пожалуйста, выберите --',onChange:()=>scheduleCalc()});
  payerCombo=createCombo(document.getElementById('payerCombo'),{id:'payer',items:PAYERS,placeholder:'-- Пожалуйста, выберите --',onChange:()=>scheduleCalc()});
  objectCombo=createCombo(document.getElementById('objectCombo'),{id:'object',items:OBJECTS,placeholder:'-- Пожалуйста, выберите --',onChange:()=>scheduleCalc()});

  /* Форматирование денежных сумм */
  document.querySelectorAll('[data-money]').forEach(el=>{
    el.addEventListener('input',()=>{formatMoneyInput(el);scheduleCalc();});
    el.addEventListener('blur',()=>formatMoneyInput(el));
  });

  /* Запрет изменения чисел колесом мыши на всех числовых инпутах */
  document.querySelectorAll('input[type="number"]').forEach(blockWheelNumber);

  /* Всё остальное — триггерит пересчёт при авто-режиме */
  ['objects','peoplePerson','peopleCompany','peoplePublic','shareNum','shareDen'].forEach(id=>{
    document.getElementById(id).addEventListener('input',scheduleCalc);
  });
  document.querySelectorAll('[data-check]').forEach(c=>c.addEventListener('change',scheduleCalc));

  document.getElementById('calc').onclick=calculate;
  document.getElementById('clear').onclick=clearForm;

  const auto=document.getElementById('autoCalc');
  auto.addEventListener('change',()=>{
    autoCalc=auto.checked;
    document.getElementById('calc').style.display=autoCalc?'none':'';
    if(autoCalc) calculate();
  });
  auto.checked=autoCalc;
  document.getElementById('calc').style.display=autoCalc?'none':'';
}

function scheduleCalc(){if(autoCalc) calculate();}

function num(id){
  const s=document.getElementById(id).value.trim().replace(/\s/g,'').replace(',','.');
  if(!s) return 0;
  const v=Number(s); return Number.isFinite(v)&&v>=0?v:NaN;
}

function showError(msg){
  document.getElementById('total').textContent='—';
  document.getElementById('perPerson').innerHTML='<span class="error">'+safe(msg)+'</span>';
  document.getElementById('detail').textContent='';
}

function calculate(){
  const action=actionCombo.value;
  const payer=payerCombo.value;
  const objectType=objectCombo.value;
  const checks=Object.fromEntries([...document.querySelectorAll('[data-check]')].map(c=>[c.dataset.check,c.checked]));
  if(!action){showError('Выберите регистрационное действие.');return;}
  if(!payer){showError('Выберите тип заявителя.');return;}
  if(!objectType){showError('Выберите вид объекта.');return;}

  const n=Math.max(1,Math.floor(num('shareNum')||1));
  const d=Math.max(1,Math.floor(num('shareDen')||1));
  const share=Math.min(1,n/d);
  const cad=num('cadValue');
  const deal=num('deal');
  const ikValue=num('ikValue');
  if(Number.isNaN(cad)||Number.isNaN(deal)||Number.isNaN(ikValue)){showError('Проверьте введённые суммы.');return;}
  const isPerson=payer==='person';
  const isCompany=payer==='company';
  const objects=Math.max(1,Math.floor(num('objects')||1));

  const fixed={
    cad_only:[2000,22000,'Кадастровый учёт объекта без регистрации права'],
    cad_change:[1000,2000,'Кадастровый учёт изменений основных сведений'],
    cad_prior:[1000,2000,'Внесение сведений о ранее учтённом объекте'],
    cad_view_change:[1000,2000,'Изменение вида объекта в рамках учёта изменений'],
    combined_create:[6000,66000,'Одновременный кадастровый учёт и регистрация созданного объекта'],
    right_reg:[2000,22000,'Регистрация прав на учтённый объект'],
    right_transfer:[2000,22000,'Регистрация перехода права'],
    restrict_reg:[1000,4000,'Регистрация ограничений и обременений'],
    part_restrict:[1000,4000,'Регистрация ограничений на часть объекта'],
    mortgage_agreement_present:[1000,4000,'Регистрация ипотеки'],
    mortgage_agreement_change:[400,1200,'Изменение записи об ипотеке'],
    mortgage_endorse:[700,12000,'Регистрация передачи права по закладной'],
    mortgage_owner:[700,12000,'Регистрация законного владельца закладной']
  };

  let perObject=0, basis='';
  let count=1;

  if(action==='combined_create'||action==='cad_only'||action==='right_reg'){
    if(checks.lph_land){
      perObject=isPerson?700:7000;
      basis='Специальная ставка для участка/объекта для ЛПХ, садоводства, ИЖС/ИГС, гаража (пп. 24 или 24.1 ст. 333.33 НК РФ).';
    } else if(checks.agri_land){
      perObject=isPerson?700:7000;
      basis='Ставка для земель сельскохозяйственного назначения (пп. 25 или 25.1 ст. 333.33 НК РФ).';
    } else {
      const key=action==='cad_only'?'cad_only':action==='right_reg'?'right_reg':'combined_create';
      const row=fixed[key];
      perObject=isPerson?row[0]:(isCompany?row[1]:row[0]);
      basis=row[2]+'.';
    }
    count=objects;
  } else if(action==='cad_change'||action==='cad_prior'||action==='cad_view_change'){
    const row=fixed[action];
    perObject=isPerson?row[0]:row[1];
    basis=row[2]+'.';
    count=1;
  } else if(action==='restrict_reg'||action==='part_restrict'||action==='deal_restrict'){
    const row=fixed.restrict_reg;
    perObject=isPerson?row[0]:row[1];
    basis=row[2]+'.';
    count=1;
  } else if(action==='right_transfer'){
    const threshold=isPerson?20000000:22000000;
    const rate=isPerson?0.0002:0.002;
    const cap=isPerson?500000:1000000;
    const base=isPerson?4000:44000;
    const cadPart=cad*share, dealPart=deal*share;
    if(!cad||cadPart<=threshold){
      perObject=base;
      basis=`Кадастровая стоимость доли ${money(cadPart)} — не выше порога ${money(threshold)}.`;
    } else {
      const fromCad=cadPart*rate, fromDeal=dealPart*rate;
      const raw=Math.min(cap,Math.max(fromCad,fromDeal));
      perObject=Math.floor(raw/100)*100;
      basis=`Ставка ${isPerson?'0,02%':'0,2%'} от кадастровой стоимости доли (${money(fromCad)})${dealPart>0?'; ориентир по цене сделки — '+money(fromDeal):''}; предел ${money(cap)}; округление вниз до 100 ₽.`;
    }
    count=objects;
  } else if(checks.enterprise_ik||objectType==='enterprise'){
    if(ikValue<=0){showError('Для ПИК укажите стоимость имущества и прав, входящих в состав предприятия.');return;}
    const fromValue=ikValue*0.002;
    const fromDeal=deal>0?deal*0.002:0;
    const raw=Math.min(1000000,Math.max(fromValue,fromDeal));
    perObject=raw;
    basis=`ПИК: 0,2 % стоимости имущества (${money(fromValue)})${deal>0?'; ориентир по цене сделки — '+money(fromDeal):''}; не более 1 000 000 ₽.`;
    count=1;
  } else if(action==='general'){
    const threshold=isPerson?20000000:22000000;
    const rate=isPerson?0.0002:0.002;
    const cap=isPerson?500000:1000000;
    const base=isPerson?4000:44000;
    const cadPart=cad*share;
    if(!cad||cadPart<=threshold){perObject=base;basis='Базовая ставка.';}
    else{const raw=Math.min(cap,cadPart*rate);perObject=Math.floor(raw/100)*100;basis='0,02%/0,2% от кадастровой стоимости доли с пределом.';}
    count=objects;
  } else {
    perObject=isPerson?350:1000;
    basis='Справочная оценка по базовой ставке; уточните по НК РФ для выбранного действия.';
    count=1;
  }

  if(!Number.isFinite(perObject)){showError('Не удалось выполнить расчёт.');return;}
  const total=perObject*count;

  const pp=Math.max(0,Math.floor(num('peoplePerson')||0));
  const pc=Math.max(0,Math.floor(num('peopleCompany')||0));
  const pu=Math.max(0,Math.floor(num('peoplePublic')||0));
  const people=pp+pc+pu;
  const each=people>0?total/people:total;

  document.getElementById('total').textContent=money(total);
  document.getElementById('perPerson').textContent=people>1
    ?`Всего плательщиков: ${people}. Доля одного: ${money(each)}.`
    :'На одного заявителя: '+money(total);
  document.getElementById('detail').innerHTML=
    `<div><b>Основание:</b> ${safe(basis)}</div>`+
    `<div><b>Ставка на один объект:</b> ${money(perObject)}</div>`+
    `<div><b>Количество объектов:</b> ${count}</div>`+
    `<div><b>Общая сумма:</b> ${money(total)}</div>`+
    `<div><b>Справочно:</b> расчёт предварительный; льготы и особые режимы не применены автоматически.</div>`;
}

function clearForm(){
  actionCombo.value='';
  payerCombo.value='';
  objectCombo.value='';
  ['deal','ikValue','cadValue','cadnum','objects','shareNum','shareDen','peoplePerson','peopleCompany','peoplePublic'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('[data-check]').forEach(c=>c.checked=false);
  document.getElementById('total').textContent='—';
  document.getElementById('perPerson').textContent='Выберите действие и нажмите «Рассчитать».';
  document.getElementById('detail').textContent='';
  if(autoCalc) calculate();
}

render();
</script>
</body>
</html>
